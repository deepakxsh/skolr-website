<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            grotesk: ['Anton', 'sans-serif'],
            condiment: ['Condiment', 'cursive'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            background: '#010828',
            cream: '#EFF4FF',
            neon: '#6FFF00',
          },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #010828;
      color: #EFF4FF;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .texture-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background-image: url('/texture.png');
      background-size: cover;
      background-repeat: no-repeat;
      mix-blend-mode: lighten;
      opacity: 0.6;
    }
   .texture-overlay { display: none; }

    .nav-link { transition: color 0.2s; }
    .nav-link:hover { color: #6FFF00; }

    .hidden-mobile { display: none; }
    @media (min-width: 1024px) { .hidden-mobile { display: flex; } }
    .shown-mobile { display: flex; }
    @media (min-width: 1024px) { .shown-mobile { display: none; } }
    .nav-hidden-mobile { display: none; }
    @media (min-width: 1024px) { .nav-hidden-mobile { display: block; } }

    .footer-bar {
      background-color: #000000;
      color: #EFF4FF;
      text-align: center;
      padding: 24px;
      font-family: 'Anton', sans-serif;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: auto;
      z-index: 100;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(111,255,0,0.5);
      animation: pulse 2s linear infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

          <li><a href="subscription.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em;">Subscription</a></li>
          <li><a href="ai.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em; color:#6FFF00;">AI</a></li>
          <li><a href="faq.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em;">FAQ</a></li>

      <a href="contact.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">Contact</a>
      <a href="subscription.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">Subscription</a>
      <a href="ai.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em; color:#6FFF00;">AI</a>
      <a href="faq.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">FAQ</a>

  <!-- Main Content -->

    <div style="font-family:monospace; font-size:24px; color:#6FFF00; text-transform:uppercase; letter-spacing:0.2em; text-align:center; padding: 10px 20px; border: 1px dashed rgba(111,255,0,0.5); border-radius: 8px; background: rgba(111,255,0,0.05);">
