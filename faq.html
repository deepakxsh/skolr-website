<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ - SKOLR INDIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            grotesk: ['Anton', 'sans-serif'],
            condiment: ['Condiment', 'cursive'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            background: '#010828',
            cream: '#EFF4FF',
            neon: '#6FFF00',
          },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #010828;
      color: #EFF4FF;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .texture-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background-image: url('/texture.png');
      background-size: cover;
      background-repeat: no-repeat;
      mix-blend-mode: lighten;
      opacity: 0.6;
    }
   .texture-overlay { display: none; }

    .nav-link { transition: color 0.2s; }
    .nav-link:hover { color: #6FFF00; }

    .hidden-mobile { display: none; }
    @media (min-width: 1024px) { .hidden-mobile { display: flex; } }
    .shown-mobile { display: flex; }
    @media (min-width: 1024px) { .shown-mobile { display: none; } }
    .nav-hidden-mobile { display: none; }
    @media (min-width: 1024px) { .nav-hidden-mobile { display: block; } }

    .footer-bar {
      background-color: #000000;
      color: #EFF4FF;
      text-align: center;
      padding: 24px;
      font-family: 'Anton', sans-serif;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: auto;
      z-index: 100;
    }

    /* Accordion Styles */
    .faq-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .faq-item {
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      transition: background 0.3s;
    }
    .faq-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .faq-question {
      width: 100%;
      text-align: left;
      padding: 24px;
      font-family: 'Anton', sans-serif;
      font-size: 20px;
      color: #EFF4FF;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.05em;
    }

    .faq-icon {
      transition: transform 0.3s ease;
      color: #6FFF00;
    }

    .faq-item.active .faq-icon {
      transform: rotate(45deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease;
      font-family: monospace;
      font-size: 16px;
      color: #EFF4FF;
      opacity: 0.8;
      padding: 0 24px;
      line-height: 1.6;
    }

    .faq-item.active .faq-answer {
      padding-bottom: 24px;
      max-height: 300px;
    }
  </style>
</head>
<body>

  <div class="texture-overlay"></div>

  <!-- Background Video -->
  <video autoplay loop muted playsinline style="position:fixed; top:0; left:0; width:100%; height:100vh; object-fit:cover; z-index:-1;">
    <source src="./background/back-1.mp4" type="video/mp4" />
  </video>
  <div style="position:fixed; top:0; left:0; width:100%; height:100vh; background: rgba(1,8,40,0.85); z-index:-1;"></div>

  <!-- Header -->
  <div style="position:relative; z-index:10; width:100%; max-width:1831px; margin:0 auto; padding: 28px 24px;">
    <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
      <a href="index.html" style="font-family:'Anton',sans-serif; font-size:24px; text-transform:uppercase; color:#EFF4FF; letter-spacing:0.08em; text-decoration:none;">
        SKOLRindia
      </a>
      <nav class="liquid-glass nav-hidden-mobile" style="border-radius:32px; padding:28px 64px;">
        <ul style="display:flex; gap:3.5rem; list-style:none; margin:0; padding:0;">
          <li><a href="index.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em;">Home</a></li>
          <li><a href="contact.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em;">Contact</a></li>
          <li><a href="subscription.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em;">Subscription</a></li>
          <li><a href="ai.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em;">AI</a></li>
          <li><a href="faq.html" class="nav-link" style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; color:#EFF4FF; text-decoration:none; letter-spacing:0.08em; color:#6FFF00;">FAQ</a></li>
        </ul>
      </nav>
      <div class="hidden-mobile" style="width:180px;"></div>
    </div>
    
    <div class="shown-mobile" style="justify-content:center; gap:16px; margin-top:2rem; flex-wrap:wrap;">
      <a href="index.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">Home</a>
      <a href="contact.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">Contact</a>
      <a href="subscription.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">Subscription</a>
      <a href="ai.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em;">AI</a>
      <a href="faq.html" class="liquid-glass nav-link" style="padding:12px 24px; border-radius:1rem; text-decoration:none; font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.08em; color:#6FFF00;">FAQ</a>
    </div>
  </div>

  <!-- Main Content -->
  <main style="flex: 1; position: relative; z-index: 10; padding: 4rem 2rem;">
    <h1 style="font-family:'Anton',sans-serif; font-size:56px; text-transform:uppercase; margin-bottom:10px; letter-spacing:0.05em; text-align:center;">FREQUENTLY ASKED QUESTIONS</h1>
    <p style="font-family:monospace; font-size:18px; color:#EFF4FF; opacity:0.8; margin-bottom:60px; text-align:center;">Everything you need to know about SKOLR.</p>
    
    <div class="faq-container" id="faqContainer">
      <!-- FAQs will be injected here via JS to keep HTML clean -->
    </div>
  </main>

  <footer class="footer-bar">
    SKOLR INDIA – All Rights Reserved – 2026
  </footer>

  <script>
    const faqs = [
      { q: "What is SKOLR?", a: "SKOLR is an AI-powered academic operating system designed to digitally transform schools through intelligent automation, real-time analytics, communication systems, and smart learning workflows." },
      { q: "How does AI improve the SKOLR experience?", a: "SKOLR integrates AI-driven insights for attendance analysis, assignment tracking, academic summaries, smart notifications, and performance monitoring for students, teachers, and parents." },
      { q: "Does SKOLR support AI-generated academic reports?", a: "Yes. SKOLR uses AI analytics to generate performance summaries, attendance trends, assignment insights, and student progress reports in real time." },
      { q: "Can AI help parents monitor student performance?", a: "Absolutely. The AI Parent Dashboard provides intelligent daily digests, attendance alerts, academic trends, and performance summaries for better parental awareness." },
      { q: "How are assignments managed in SKOLR?", a: "Teachers can create AI-enhanced assignments with due dates, priorities, attachments, subject mapping, and classroom targeting. Students receive assignments instantly within their dashboards." },
      { q: "Does SKOLR support AI-powered notifications?", a: "Yes. SKOLR prioritizes important updates using AI-assisted notification systems for assignments, exams, attendance anomalies, and announcements." },
      { q: "Can teachers manage multiple classrooms and subjects?", a: "Yes. SKOLR provides centralized classroom management with dynamic subject mapping and multi-class assignment distribution." },
      { q: "Does SKOLR support file and media uploads?", a: "Yes. Teachers and students can securely upload PDFs, images, videos, documents, and assignment submissions using cloud-integrated storage." },
      { q: "Is SKOLR cloud-based?", a: "Yes. SKOLR uses modern cloud infrastructure for scalable storage, secure authentication, and synchronized academic data access." },
      { q: "What kind of analytics does SKOLR provide?", a: "SKOLR offers AI-powered analytics including: Attendance intelligence, Assignment completion tracking, Student performance metrics, Grade visualization, and Academic trend analysis." },
      { q: "Can students track pending work using AI?", a: "Yes. The AI student dashboard automatically prioritizes overdue assignments, upcoming deadlines, and performance-based recommendations." },
      { q: "Does SKOLR include an AI communication system?", a: "Yes. SKOLR supports intelligent communication workflows between teachers, students, and parents through announcements, messaging, and smart alerts." },
      { q: "Is SKOLR optimized for mobile devices?", a: "Yes. SKOLR is built using a mobile-first architecture optimized for modern Android devices with responsive UI and high-performance navigation." },
      { q: "Does SKOLR support role-based dashboards?", a: "Yes. SKOLR dynamically provides dedicated AI-enhanced interfaces for: Teachers, Students, Parents, and School administrators." },
      { q: "How secure is SKOLR?", a: "SKOLR uses token-based authentication, encrypted cloud storage, and secure API architecture to ensure data privacy and institutional security." },
      { q: "Can SKOLR automate academic workflows?", a: "Yes. SKOLR automates assignment delivery, attendance workflows, notification distribution, and report generation using AI-assisted systems." },
      { q: "Does SKOLR provide real-time updates?", a: "Yes. The platform supports real-time synchronization of attendance, assignments, announcements, grades, and academic activity." },
      { q: "Can SKOLR scale for large institutions?", a: "Yes. SKOLR is designed with scalable backend architecture capable of supporting multi-classroom and multi-role educational ecosystems." },
      { q: "Does SKOLR support future AI integrations?", a: "Yes. The platform architecture is designed to support future AI modules including predictive analytics, AI tutors, smart recommendations, and intelligent classroom systems." },
      { q: "Why is SKOLR different from traditional school management apps?", a: "Unlike traditional ERP systems, SKOLR combines AI intelligence, modern UX design, cloud-native infrastructure, real-time analytics, and automated academic workflows into a unified platform experience." }
    ];

    const container = document.getElementById('faqContainer');

    faqs.forEach((faq, index) => {
      const item = document.createElement('div');
      item.className = 'liquid-glass faq-item';
      
      item.innerHTML = `
        <button class="faq-question">
          <span>${faq.q}</span>
          <svg class="faq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div class="faq-answer">
          ${faq.a}
        </div>
      `;

      const btn = item.querySelector('.faq-question');
      btn.addEventListener('click', () => {
        const isActive = item.classList.contains('active');
        
        // Close all other items
        document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('active'));
        
        if (!isActive) {
          item.classList.add('active');
        }
      });

      container.appendChild(item);
    });
  </script>
</body>
</html>
